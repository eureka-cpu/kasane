# vim:ft=kitty

## name: obi-raised gamma
## author: eureka-cpu · https://github.com/eureka-cpu
## license: MIT
## blurb: Gamma-corrected variant -- ICC-shifted so kitty renders the same
##   perceived values as the browser shows for the base theme on a wide-gamut
##   display. Base: A blue-black, ashy ground inspired by the kimono's sash, paired
##   with shibui's restraint and ferra's warmer, more varied accent spread.
##   Where ai and shibui made blue the hero, obi demotes it to a whisper.
##   Raised surface variant.

# The cursor color
cursor #cdc4a4

# The foreground color
foreground #cdc4a4

# The background color
background #2b2c2e

# The foreground for selections
selection_foreground #cdc4a4

# The background for selections
selection_background #36383c

# The 16 terminal colors. There are 8 basic colors, each color has a dull and
# bright version.

# black
color0   #1b1b1d
color8   #56585f

# red -- beni
color1   #b56165
color9   #c98687

# green -- cha
color2   #919874
color10  #a9b38c

# yellow -- kaki (persimmon, not gold: ferra's coral, muted)
color3   #be8e74
color11  #ceab91

# blue -- ai (demoted to a whisper, not the hero)
color4   #99a2b2
color12  #b2b9c3

# magenta -- sakura (pink, not plum: back toward ferra)
color5   #bc9ea9
color13  #ad838f

# cyan -- mizu
color6   #6c9894
color14  #85ada9

# white
color7   #9b938d
color15  #c7c2bc

active_tab_foreground   #cdc4a4
active_tab_background   #313236
inactive_tab_foreground #9b938d
inactive_tab_background #2b2c2e
