# vim:ft=kitty

## name: obi
## author: eureka-cpu · https://github.com/eureka-cpu
## license: MIT
## blurb: A blue-black, ashy ground inspired by the kimono's sash, paired
##   with shibui's restraint and ferra's warmer, more varied accent spread.
##   Where ai and shibui made blue the hero, obi demotes it to a whisper.

# The cursor color
cursor #d4cba9

# The foreground color
foreground #d4cba9

# The background color
background #1c1d20

# The foreground for selections
selection_foreground #d4cba9

# The background for selections
selection_background #313338

# The 16 terminal colors. There are 8 basic colors, each color has a dull and
# bright version.

# black
color0   #151517
color8   #585a62

# red -- beni
color1   #ba6367
color9   #d08a8b

# green -- cha
color2   #969d77
color10  #aeb990

# yellow -- kaki (persimmon, not gold: ferra's coral, muted)
color3   #c49277
color11  #d5b195

# blue -- ai (demoted to a whisper, not the hero)
color4   #9ea7ba
color12  #b7bfce

# magenta -- sakura (pink, not plum: back toward ferra)
color5   #c2a3af
color13  #b28793

# cyan -- mizu
color6   #709d98
color14  #8ab3af

# white
color7   #a09891
color15  #cdc9c6

active_tab_foreground   #d4cba9
active_tab_background   #27282b
inactive_tab_foreground #a09891
inactive_tab_background #1c1d20
