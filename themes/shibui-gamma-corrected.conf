color0   #1e1f24
color8   #515869

# red
color1   #ad625e
color9   #c28a86

# green
color2   #8e946f
color10  #a9ad8f

# yellow
color3   #ae9668
color11  #c2ab87

# blue
color4   #99a2b2
color12  #b2b9c3

# magenta
color5   #ac90a9
color13  #947792

# cyan
