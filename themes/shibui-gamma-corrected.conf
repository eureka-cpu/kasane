# vim:ft=kitty

## name: shibui gamma corrected
## author: eureka-cpu · https://github.com/eureka-cpu
## license: MIT
## blurb: Gamma-corrected variant -- ICC-shifted so kitty renders the same
##   perceived values as the browser shows for the base theme on a wide-gamut
##   display. Base: A quieter cut of ai — same ground (scroll, kimono, tatami), but
##   with the accents desaturated and deepened toward ferra's restraint.
##   Named for shibui (渋い), the subdued, unobtrusive beauty in traditional
##   Japanese aesthetics.

# The cursor color
cursor #99a2b2

# The foreground color
foreground #cbc4a7

# The background color
background #24262b

# The foreground for selections
selection_foreground #cbc4a7

# The background for selections
selection_background #363a46

# The 16 terminal colors. There are 8 basic colors, each color has a dull and
# bright version.

